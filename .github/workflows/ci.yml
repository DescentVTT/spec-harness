name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the whole matrix again on the commit it publishes.
  workflow_call:

# Called by the release, `github.workflow` is the caller's name, so its CI has a
# group of its own: a push to main cannot cancel a release rehearsal's CI
# halfway, and a rehearsal cannot cancel main's.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository. A caller must grant at least this, and
# the release grants exactly this to the job that calls it.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Headroom for a bad runner, not a budget: the slowest leg, Windows, took
    # under three minutes. A job that hangs stops here rather than at GitHub's
    # six hours, and so does the release, which runs this matrix.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor, 24 the active LTS, 26 the current release.
        # Each image by the label that is its alone, never `-latest`, which
        # GitHub moves (tests/runner-images.test.ts). Windows and macOS are what
        # their `-latest` gave on 2026-10-07. Both Ubuntu images, because
        # `ubuntu-latest` hands a user's job either from 2026-10-19 and the
        # suite runs the image's git, ssh-keygen and bash. spec-core's
        # ADR-0008 has the steps that move one.
        os: [ubuntu-24.04, ubuntu-26.04, windows-2025-vs2026, macos-26]
        node: ['22', '24', '26']
    steps:
      # Pinned to commits, with the tag beside each, as in the sibling tools.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency's install script runs: the tree needs none, npm 12 runs
      # none unless package.json allows the package, and the flag has npm 10 and
      # 11 run none either (tests/npm.test.ts).
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      # The skills and the plugin manifests ship in the package; a test holds
      # their size and shape, and this proves the package still packs.
      - name: Pack
        run: npm pack --dry-run

  # The lockfile holds each sibling's newest release, so the matrix above runs
  # what a user installing today runs. This job holds the other end of the
  # range package.json promises: the suite again, with each sibling it runs
  # at the oldest release MINIMUM_VERSIONS says this one runs (ADR-0011). One
  # leg, since what differs from the matrix is the siblings, not the platform.
  #
  # On one image, as coverage, the sweeps and the release are: the one their
  # numbers were measured on. Moving one is spec-core's ADR-0008.
  minimum:
    name: test (minimum siblings)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 24, whose node runs the script below as it is written, as the release
      # runs scripts/release.ts.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # The versions are read from src/versions.ts, so none is written here.
      # Assigned first, because a script that fails inside the install's own
      # arguments would leave `npm install --no-save` with none, which
      # installs nothing and exits 0. --no-save leaves package.json and the
      # lockfile as they are; the last line fails unless node_modules now
      # holds exactly the minimums, so the suite below cannot pass on the
      # newest by mistake.
      - name: Install each sibling at its minimum
        run: |
          specs="$(node scripts/minimum-siblings.ts)"
          npm install --no-save $specs
          node scripts/minimum-siblings.ts --installed
      # A few integration tests spawn bin/spec-harness.js, which runs dist/.
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # A few integration tests spawn bin/spec-harness.js, which runs dist/.
      - name: Build
        run: npm run build
      - name: Test with coverage
        run: npm run test:coverage

  mutation:
    name: mutation (core)
    runs-on: ubuntu-24.04
    # The core sweep took 6 to 8 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Core mutation sweep
        run: npm run test:mutation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-core
          path: reports/mutation-core/
          if-no-files-found: ignore
