name: Mutation

# The full sweep, recorded in docs/adr/0010-toolchain-and-verification.md.
#
# The core sweep mutates the pure modules and holds them to the unit suite. It
# is a job in ci.yml, on every change, and its `break` in
# stryker.core.config.mjs is the gate.
#
# The full sweep mutates the edges as well - the command line, init, the
# server, git and the siblings - against the whole suite. Its tests spawn git
# and the sibling tools for every mutant they reach, so it is slower by an
# order of magnitude, and does not run on every change: it runs for a change
# to what only it reaches, weekly, and on request. One runner took 69 to 130
# minutes for it, so it runs in shards, each mutating its own files against
# every test (scripts/mutation-shards.mjs), a mutant's quickest test files
# first (vitest.mutation.config.ts), and the job after them merges the
# reports and applies the `break` in stryker.config.mjs once, to the merged
# score. The same step counts what the merged report could not hold, the
# code under a TypeScript `as` (scripts/mutation-unmeasured.mjs), and the
# step after it names the undetected mutants that main's newest sweep did not
# have (scripts/mutation-compare.mjs).
on:
  # A pull request that changes a module the core sweep does not mutate
  # whole, or what this sweep is made of, is swept before it merges: twice a
  # change to such a module merged with every mutant of a replay by hand
  # killed, and the release's sweep then found survivors of it (ADR-0010,
  # amended a third time 2026-10-12). The sources are named one by one, and
  # tests/mutation-shards.test.ts holds the names to the two sweeps'
  # `mutate`: a module added to src/ is in the core sweep's list or in this
  # one, or the suite fails. What the sweep is made of is the Stryker
  # configurations, the core sweep's with them since it says which modules
  # are left to this one, the suite's, the scripts and this file. The sweep
  # is of the pull request merged into main, the commit GitHub checks out
  # for one.
  #
  # GitHub reads a filter against everything a pull request changes, not
  # against its last push, so every push to one that changes such a file
  # runs the sweep again.
  #
  # The last two entries are what the sweep's verdicts are made of beside
  # the sources it mutates (ADR-0010, amended 2026-10-14). The integration
  # suite is where the kills of those fourteen modules' mutants come from,
  # nineteen in twenty of them, and it shares its helpers with nothing
  # outside tests/integration, which the same test holds. The vendored
  # spec-core is mutated in spec-core's sweep and not in this one, and six
  # of the modules mutated here read through it. `dir/**` is every file in
  # the directory and under it. What still runs no sweep, and the schedule
  # below reads: a dependency's bump alone, and a unit test alone, which the
  # core sweep in ci.yml reads for the modules it mutates and no sweep reads
  # for git.ts and workspace.ts until Monday.
  pull_request:
    paths:
      - src/cli.ts
      - src/commands.ts
      - src/document.ts
      - src/fs.ts
      - src/git.ts
      - src/host.ts
      - src/plugin.ts
      - src/premises.ts
      - src/round.ts
      - src/sandbox.ts
      - src/server.ts
      - src/setup.ts
      - src/siblings.ts
      - src/workspace.ts
      - stryker.config.mjs
      - stryker.core.config.mjs
      - stryker.shard.config.mjs
      - vitest.mutation.config.ts
      - scripts/mutation-*.mjs
      - .github/workflows/mutation.yml
      - tests/integration/**
      - src/vendor/**
  # The same change once it is on main, so that main has a report of its own
  # head for the next pull request to be compared with. The two lists are
  # one list, written twice because a filter belongs to its event; the same
  # test holds them equal.
  push:
    branches: [main]
    paths:
      - src/cli.ts
      - src/commands.ts
      - src/document.ts
      - src/fs.ts
      - src/git.ts
      - src/host.ts
      - src/plugin.ts
      - src/premises.ts
      - src/round.ts
      - src/sandbox.ts
      - src/server.ts
      - src/setup.ts
      - src/siblings.ts
      - src/workspace.ts
      - stryker.config.mjs
      - stryker.core.config.mjs
      - stryker.shard.config.mjs
      - vitest.mutation.config.ts
      - scripts/mutation-*.mjs
      - .github/workflows/mutation.yml
      - tests/integration/**
      - src/vendor/**
  schedule:
    # An hour after spec-guard's and two after spec-brief's and spec-graph's,
    # which start at 03:00 on the same account's runners.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: Run the full sweep
        type: boolean
        default: true

# A dispatch supersedes an earlier dispatch on the same ref; nothing supersedes
# the schedule's run, so the event is part of the key. For a pull request the
# ref is its merge branch, refs/pull/<number>/merge, so a newer push to one
# ends the sweep of the push before it and no other's. A push to main that
# runs the sweep ends that of the push before it, whose commit it holds.
concurrency:
  group: mutation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  shard:
    name: mutation (full, shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    # Only a dispatch has the input, and only a dispatch can leave the sweep out.
    if: github.event_name != 'workflow_dispatch' || inputs.full
    # The image the hosted sweeps in ADR-0010 were measured on. Another image
    # is another measurement: spec-core's ADR-0008 says what moving takes.
    runs-on: ubuntu-24.04
    # Headroom for a bad runner, not a budget: by the five sweeps the table in
    # scripts/mutation-shards.mjs was levelled on, a shard's files take 12 to
    # 14 minutes and its job about three more (ADR-0010, amended 2026-10-14).
    # Stryker writes a shard's report only when the shard ends, so a shard cut
    # short measures nothing and the merge refuses the sweep; Re-run failed
    # jobs runs that shard again, and the merge takes the other shards'
    # reports from the first attempt. A shard that keeps passing 22, five
    # minutes more than the table has its longest, means the table needs
    # re-measuring, or that the suite has grown, which every static mutant
    # that survives runs whole: not this number raising.
    timeout-minutes: 60
    strategy:
      # One broken shard should not hide what the others found. The merge
      # refuses to score a sweep with a shard missing either way.
      fail-fast: false
      matrix:
        # One entry per shard in scripts/mutation-shards.mjs; a test checks.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      # Pinned to commits, with the tag beside each, as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      # No dependency's install script runs: the tree needs none, npm 12 runs
      # none unless package.json allows the package, and the flag has npm 10 and
      # 11 run none either (tests/npm.test.ts).
      - run: npm ci --ignore-scripts

      # A few integration tests spawn bin/spec-harness.js, which runs dist/.
      # Stryker copies dist/ into its sandbox, and the initial test run fails
      # without it.
      - name: Build
        run: npm run build

      # `--no-install`: the sweep runs the Stryker that `npm ci` installed, and
      # a job that lost that step stops here, where npx alone would fetch
      # whatever the registry has under the name. `.npmrc` says the same for
      # every command (tests/npm.test.ts).
      - name: Full mutation sweep, one shard
        run: |
          started=$SECONDS
          npx --no-install stryker run stryker.shard.config.mjs
          echo "{\"seconds\": $((SECONDS - started))}" > "reports/mutation/shard-$MUTATION_SHARD.timing.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-full-shard-${{ matrix.shard }}
          path: reports/mutation/shard-${{ matrix.shard }}*.json
          if-no-files-found: error
          retention-days: 14

  full:
    name: mutation (full)
    needs: shard
    # Runs when a shard failed too, so the failure is reported as an incomplete
    # sweep rather than as a skipped check.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The comparison below fetches the report of another run, main's, and
    # GitHub hands a run's artifact only to a token that may read Actions.
    # A job that names its permissions has no other, so the one every job
    # has is said again; the shards keep the workflow's.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      # The merge scores with Stryker's own metrics library.
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-full-shard-*
          path: reports/shards

      # The score, and then what no score holds: the places a mutator applies
      # that stand under a TypeScript `as`, of which Stryker makes no mutant.
      # More of them than scripts/mutation-unmeasured.mjs records as left fails
      # the sweep, as a score under the `break` does.
      - name: Merge the shards and apply the gate
        run: |
          node scripts/mutation-shards.mjs merge reports/shards
          node scripts/mutation-unmeasured.mjs reports/mutation/mutation.json

      # Which undetected mutants main's newest full sweep that passed did not
      # have, in the summary and the log, by file, mutator, mutated text and
      # replacement and never by line. It runs where the score is under the
      # `break` too, which is when the list is wanted most, and not where the
      # merge wrote no report. It fails the sweep for none of them, and where
      # main has no report to fetch it says that nothing was compared.
      - name: Name the undetected mutants that are new against main
        if: ${{ !cancelled() && hashFiles('reports/mutation/mutation.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mutation-compare.mjs --main reports/mutation/mutation.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-full
          path: |
            reports/mutation/index.html
            reports/mutation/mutation.json
          if-no-files-found: ignore
